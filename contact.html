<!DOCTYPE html>
<html>

<head>
    <title>Contact Us - Smart Canteen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Contact Us</h1>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="how-it-works.html">How It Works</a>
        <a href="links.html">Useful Links</a>
        <a href="contact.html">Contact Us</a>
    </nav>

    <section class="content">
        <div class="contact-container" style="max-width: 600px; margin: 0 auto;">

            <div class="card" style="margin-bottom: 30px; text-align: center; padding: 30px;">
                <h3>We're All Ears!</h3>
                <p>Have a suggestion or just want to say hi? We'd love to chat.</p>
                <p><strong>Email:</strong> canteen@siet.ac.in</p>
                <p><strong>Phone:</strong> +91 98765 43210</p>
            </div>

            <div class="card" style="padding: 30px;">
                <h3 style="text-align: center; margin-bottom: 20px; color: #1e4fa8;">Send us a Message</h3>
                <form>
                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="name" placeholder="Your Name" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label">Message</label>
                        <textarea class="form-control" id="message" rows="4" placeholder="Your feedback or query..."
                            required></textarea>
                    </div>
                    <button type="submit" class="cta-btn"
                        style="width: 100%; border: none; cursor: pointer;">Submit</button>
                </form>
            </div>

        </div>
    </section>

    <footer>
        <p>We are here to serve you better.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
